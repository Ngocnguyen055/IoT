{% extends "base.html" %}

{% block title %}IOT - Ngọc | Đăng nhập{% endblock %}
{% block body_class %}login{% endblock %}

{% block content %}
  <form method="post" class="panel">
    <h1>IOT - Ngọc</h1>
    <p>Đăng nhập để xem vị trí và dữ liệu thiết bị.</p>
    <input type="password" name="password" placeholder="Mật khẩu quản trị" required>
    <button>Đăng nhập</button>
    <p class="error">{{ error or '' }}</p>
  </form>
{% endblock %}
